name: Move tags

on:
  workflow_call:
    inputs:
      app-client-id:
        description: 이동 태그를 쓰는 전용 GitHub App의 Client ID입니다.
        type: string
        required: false
        default: ""
    secrets:
      app-private-key:
        description: 이동 태그를 쓰는 전용 GitHub App의 개인 키입니다.
        required: false

permissions: {}

jobs:
  check:
    name: Check release event
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      should-move: ${{ steps.check.outputs.should-move }}
      major: ${{ steps.check.outputs.major }}
      minor: ${{ steps.check.outputs.minor }}
    steps:
      # 인증보다 먼저 이벤트를 확인하여, 갱신 대상이 아닌 호출은 자격 증명 없이 끝냅니다.
      - name: Check event and tag
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "release" || "$EVENT_ACTION" != "published" ]]; then
            echo "::warning title=move-tags::이 워크플로는 GitHub Release 발행(release.published) 이벤트에서만 사용할 수 있습니다. 현재 이벤트가 ${EVENT_NAME}${EVENT_ACTION:+.$EVENT_ACTION}이므로 이동 태그를 변경하지 않고 종료합니다."
            echo "should-move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            echo "::notice title=move-tags::${TAG_NAME} 태그는 사전 릴리스이므로 이동 태그를 갱신하지 않습니다."
            echo "should-move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 안정 릴리스의 고정 태그 vX.Y.Z만 허용합니다. SemVer에 따라 앞자리 0은 허용하지 않습니다.
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::notice title=move-tags::${TAG_NAME} 태그는 vX.Y.Z 형식이 아니므로 이동 태그를 갱신하지 않습니다."
            echo "should-move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should-move=true"
            echo "major=${BASH_REMATCH[1]}"
            echo "minor=${BASH_REMATCH[2]}"
          } >> "$GITHUB_OUTPUT"
          echo "${TAG_NAME} 태그를 기준으로 이동 태그 v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}, v${BASH_REMATCH[1]}을 갱신합니다."
